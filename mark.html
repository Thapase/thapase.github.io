<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Living Parchment — Leave Your Mark • T.H.H. Thapase</title>
  <meta name="description" content="Communal parchment ledger. Choose your spirit animal rubber stamp or fingerprint and ink color, and leave your imprint." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23233124'/><text x='50%' y='55%' font-family='serif' font-weight='400' font-size='44' fill='%23F2EEDC' text-anchor='middle' dominant-baseline='middle'>TH</text></svg>" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            paper: {
              50: '#FAF8F1',
              100: '#F2EEDC',
              200: '#E8E3CE',
              300: '#DED8C0'
            },
            ink: {
              900: '#17221A',
              800: '#233124',
              700: '#324434',
              600: '#4C5848'
            },
            terracotta: {
              400: '#8C5738',
              500: '#75482E',
              600: '#5E3822'
            }
          },
          fontFamily: {
            serif: ['Bellefair', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Immediate Theme Initializer -->
  <script>
    (function () {
      const stored = localStorage.getItem('thp_site_theme');
      if (stored === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      }
    })();
  </script>
</head>
<body class="overflow-hidden select-none bg-[#F2EEDC] dark:bg-[#121A15] text-[#233124] dark:text-[#F2EEDC] font-serif transition-colors duration-400">

  <!-- ========================================================================
       Background Mountain Horizon (Synchronized with Landing Page)
       ======================================================================== -->
  <div class="scene opacity-60" aria-hidden="true">
    <div class="painted-sky-drift">
      <img class="sky-base-image" src="assets/images/continuous-sky.webp" alt="" decoding="async" />
    </div>
  </div>
  <div class="mountain-horizon opacity-75" aria-hidden="true">
    <div class="mountain-layer mountain-distant"></div>
    <div class="mountain-layer mountain-mid"></div>
    <div class="mountain-layer mountain-woodland"></div>
  </div>

  <!-- ========================================================================
       Top Navigation Bar
       ======================================================================== -->
  <header class="fixed top-0 left-0 right-0 z-30 flex items-center justify-between px-4 sm:px-6 py-3 border-b border-[#829078]/25 backdrop-blur-md bg-[#F2EEDC]/80 dark:bg-[#121A15]/80 text-xs font-mono">
    
    <!-- Back to Portfolio -->
    <a href="index.html" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#FAF8F1] dark:bg-white/5 border border-[#829078]/35 hover:border-[#75482E] text-[#233124] dark:text-[#F2EEDC] hover:text-[#75482E] dark:hover:text-[#d89667] transition-all shadow-sm cursor-pointer" title="Return to Landing Page">
      <i class="fa-solid fa-arrow-left text-[10px]"></i>
      <span class="font-serif">Back to Portfolio</span>
    </a>

    <!-- Center Status Indicator -->
    <div class="hidden sm:flex items-center gap-2 text-[#75482E] dark:text-[#d89667] text-[11px] uppercase tracking-widest font-mono">
      <span class="w-1.5 h-1.5 rounded-full bg-[#75482E] dark:bg-[#d89667] animate-pulse"></span>
      <span>The Living Parchment</span>
    </div>

    <!-- Right Controls: Clear & Mode -->
    <div class="flex items-center gap-2 sm:gap-2.5">
      <button id="clear-stamps-btn" type="button" class="px-2.5 py-1 rounded-full text-[11px] font-mono bg-[#FAF8F1] dark:bg-white/5 hover:border-[#75482E] text-[#4C5848] dark:text-[#A4B39E] border border-[#829078]/30 transition-all flex items-center gap-1.5 cursor-pointer shadow-sm" title="Clear your stamped impressions">
        <i class="fa-solid fa-rotate-left text-[10px]"></i>
        <span class="hidden sm:inline">Clear Mine</span>
      </button>

      <button id="theme-toggle-btn" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-[#FAF8F1] dark:bg-white/5 border border-[#829078]/35 flex items-center justify-center text-xs text-[#75482E] dark:text-amber-400 cursor-pointer shadow-sm" title="Toggle Light / Dark mode">
        <i id="theme-toggle-icon" class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- ========================================================================
       Interactive Stamping Canvas Area
       ======================================================================== -->
  <main id="parchment-canvas" class="ledger-canvas pt-16">
    
    <!-- Initial Zen Canvas Prompt (Fades out upon first stamp) -->
    <div id="canvas-hint" class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center text-center px-4 transition-opacity duration-700">
      <div class="p-4 sm:p-6 rounded-2xl sm:rounded-3xl bg-[#FAF8F1]/85 dark:bg-[#121A15]/85 border border-[#829078]/30 backdrop-blur-sm max-w-xs sm:max-w-sm space-y-2 shadow-lg mx-auto">
        <div class="w-10 h-10 rounded-full bg-[#75482E]/10 dark:bg-[#d89667]/15 text-[#75482E] dark:text-[#d89667] flex items-center justify-center text-lg mx-auto">
          <i class="fa-solid fa-fingerprint"></i>
        </div>
        <h2 class="text-xl sm:text-2xl font-serif text-[#233124] dark:text-[#F2EEDC]">
          Leave Your Impression
        </h2>
        <p class="text-xs font-serif text-[#4C5848] dark:text-[#A4B39E] leading-relaxed">
          Select your mark and ink color from the toolbar below. Tap anywhere on the parchment to stamp.
        </p>
        <div class="pt-1 text-[10px] font-mono uppercase tracking-widest text-[#75482E] dark:text-[#d89667]">
          Tap anywhere to begin
        </div>
      </div>
    </div>

  </main>

  <!-- ========================================================================
       Floating Bottom Toolbar (Dock: Stamps + Inkwell Palette)
       ======================================================================== -->
  <div class="ledger-dock flex flex-col sm:flex-row items-center gap-2 sm:gap-4">
    
    <!-- Top row on mobile / Left group on desktop: Stamps + Inks -->
    <div class="flex items-center justify-between sm:justify-start w-full sm:w-auto gap-2 sm:gap-4">
      <!-- Spirit Animal & Fingerprint Stamp Choices -->
      <div class="flex items-center gap-1 sm:gap-1.5" role="radiogroup" aria-label="Select stamp shape">
        
        <!-- 1. Fingerprint -->
        <button type="button" class="stamp-tool-btn active" data-stamp="fingerprint" title="Fingerprint (Human Biometric Seal)">
          <i class="fa-solid fa-fingerprint text-sm sm:text-base"></i>
        </button>

        <!-- 2. Snow Leopard -->
        <button type="button" class="stamp-tool-btn" data-stamp="leopard" title="Snow Leopard (Mountain Agility & Endurance)">
          <span class="text-sm sm:text-base leading-none">🐆</span>
        </button>

        <!-- 3. Highland Eagle -->
        <button type="button" class="stamp-tool-btn" data-stamp="eagle" title="Highland Eagle (Vision & Perspective)">
          <span class="text-sm sm:text-base leading-none">🦅</span>
        </button>

        <!-- 4. Trail Wolf -->
        <button type="button" class="stamp-tool-btn" data-stamp="wolf" title="Trail Wolf (Grit & Road Running Stamina)">
          <span class="text-sm sm:text-base leading-none">🐺</span>
        </button>

        <!-- 5. Forest Stag -->
        <button type="button" class="stamp-tool-btn" data-stamp="stag" title="Forest Stag (Quiet Nobility & Wilderness)">
          <span class="text-sm sm:text-base leading-none">🦌</span>
        </button>

        <!-- 6. Elephant -->
        <button type="button" class="stamp-tool-btn" data-stamp="elephant" title="Elephant (Grounded Wisdom & Memory)">
          <span class="text-sm sm:text-base leading-none">🐘</span>
        </button>

      </div>

      <!-- Divider -->
      <div class="h-5 sm:h-6 w-px bg-[#829078]/30"></div>

      <!-- Inkwell Color Palette -->
      <div class="flex items-center gap-1.5 sm:gap-2.5" role="radiogroup" aria-label="Select ink color">
        
        <!-- Terracotta Clay -->
        <button type="button" class="ink-color-dot active" data-color="#75482E" style="background-color: #75482E;" title="Terracotta Clay Ink"></button>

        <!-- Forest Ink -->
        <button type="button" class="ink-color-dot" data-color="#233124" style="background-color: #233124;" title="Forest Ink"></button>

        <!-- Alpine Indigo -->
        <button type="button" class="ink-color-dot" data-color="#284455" style="background-color: #284455;" title="Alpine Indigo Ink"></button>

        <!-- Sunlit Ochre -->
        <button type="button" class="ink-color-dot" data-color="#9E6236" style="background-color: #9E6236;" title="Sunlit Ochre Ink"></button>

        <!-- Sage Moss -->
        <button type="button" class="ink-color-dot" data-color="#526048" style="background-color: #526048;" title="Sage Moss Ink"></button>

      </div>
    </div>

    <!-- Divider (hidden on mobile, visible on desktop) -->
    <div class="hidden sm:block h-6 w-px bg-[#829078]/30"></div>

    <!-- Bottom row on mobile / Right group on desktop: Social Sign-On & Handle Section -->
    <div class="flex items-center justify-center sm:justify-start w-full sm:w-auto gap-1.5 text-xs font-mono">
      <!-- 1-Click Social Sign-In Buttons -->
      <button id="google-auth-btn" type="button" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-[#FAF8F1] dark:bg-white/5 border border-[#829078]/40 hover:border-[#75482E] flex items-center justify-center cursor-pointer transition-all hover:scale-105 shadow-sm shrink-0" title="1-Click Sign in with Google / Gmail">
        <i class="fa-brands fa-google text-[10px] sm:text-[11px] text-red-500"></i>
      </button>

      <button id="twitter-auth-btn" type="button" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-[#FAF8F1] dark:bg-white/5 border border-[#829078]/40 hover:border-[#75482E] flex items-center justify-center cursor-pointer transition-all hover:scale-105 shadow-sm shrink-0" title="1-Click Sign in with Twitter / X">
        <i class="fa-brands fa-x-twitter text-[10px] sm:text-[11px] text-[#233124] dark:text-[#F2EEDC]"></i>
      </button>

      <!-- Active User Handle Pill (Editable or displays signed-in identity) -->
      <div class="flex-1 sm:flex-initial flex items-center gap-1.5 px-2.5 sm:px-3 py-1 rounded-full bg-[#FAF8F1]/90 dark:bg-black/30 border border-[#829078]/40 shadow-sm min-w-0">
        <i id="handle-type-icon" class="fa-brands fa-x-twitter text-[10px] sm:text-[11px] text-[#75482E] dark:text-[#d89667] shrink-0"></i>
        <input id="handle-input" type="text" placeholder="@handle or gmail" maxlength="32" class="bg-transparent border-none outline-none w-full sm:w-32 text-xs text-[#233124] dark:text-[#F2EEDC] placeholder-[#829078] font-mono" title="Signed in handle or type manually" />
      </div>
    </div>

  </div>

  <!-- Toast Notification -->
  <div id="site-toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 px-4 py-2 rounded-2xl bg-[#FAF8F1] dark:bg-[#121A15] border border-[#829078]/40 text-xs font-serif text-[#233124] dark:text-[#F2EEDC] shadow-2xl transition-all duration-300 opacity-0 pointer-events-none">
    <i class="fa-solid fa-check text-[#75482E] dark:text-[#d89667]"></i>
    <span id="toast-text">Impression stamped</span>
  </div>

  <!-- Supabase JS Client (Free-tier cloud database & OAuth) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Site Config -->
  <script src="js/config.js"></script>

  <!-- Parchment & Rubber Stamp Engine -->
  <script src="js/mark.js"></script>

</body>
</html>
