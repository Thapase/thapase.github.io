<svg class="night-sky-stars-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
  <!-- Soft Nebula Glow Dust -->
  <defs>
    <style>
      .star-twinkle-1 {
        animation: starTwinkleA 3.5s ease-in-out infinite;
      }
      .star-twinkle-2 {
        animation: starTwinkleB 4.8s ease-in-out infinite 1.2s;
      }
      .star-twinkle-3 {
        animation: starTwinkleC 6.2s ease-in-out infinite 2.5s;
      }
      .star-glow {
        animation: starPulse 5s ease-in-out infinite;
      }
      .star-flare {
        animation: flareShine 4s ease-in-out infinite;
      }

      @keyframes starTwinkleA {
        0%, 100% { opacity: 0.35; transform-origin: center; }
        50% { opacity: 0.95; }
      }
      @keyframes starTwinkleB {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 0.25; }
      }
      @keyframes starTwinkleC {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes starPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes flareShine {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.9; }
      }
    </style>
    <radialGradient id="nebulaGlow1" cx="65%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.07" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaGlow2" cx="25%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="700" fill="url(#nebulaGlow1)" />
  <rect x="0" y="0" width="1600" height="700" fill="url(#nebulaGlow2)" />
  
